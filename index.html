["Verb patterns (-ing / base / to)","<ul><li><b>Base verb (V1):</b> had better; see, let, watch, keep, notice, make, hear, feel + object.</li><li><b>-ing:</b> would you mind, look forward to, with a view to, objected to, insisted on, accustomed to; it is no use / no good / worth / worthwhile; confident of; prevent/prohibit from; enjoy, dislike, avoid, practise, suggest, finish, consider, miss.</li><li>Would you mind <b>if</b> + past tense (Would you mind if I went out).</li><li>A sentence starting with ‘to’ or an -ing word takes a singular verb.</li></ul>","23"],
["Subject–verb agreement","<ul><li>Many + plural noun + plural verb. Many a + singular noun + singular verb.</li><li>The number of → singular. A number of → plural.</li><li>More than one + singular noun + singular verb. More than two + plural noun + plural verb.</li></ul>","23"],
["Plurals of compound nouns","<ul><li><b>First part changes:</b> commanders-in-chief, sons-in-law, passers by, lookers on, hangers on, runners up, men-of-war.</li><li><b>Second part changes:</b> boy friends, maid servants, man eaters, lady doctors, girl students, mouthfuls, grown ups, pick pockets.</li><li><b>Both parts change:</b> Lords Justices, Men Servants, Women Servants.</li></ul>","23"],
["Prepositions &amp; relatives","<ul><li>+ to: prefer, refer, junior, senior, inferior, superior, elder, anterior, posterior, prior, injurious.</li><li>+ at: peep, look, stare, glance, glare, gaze.</li><li>Jealous/envious of; jealousy/envy for; fond of; fondness for. Sympathy for; sympathetic to; sympathised with.</li><li>Rivers, countries → whose. Reason → why. Such / the same → as.</li><li>Articles: the + scientific inventions; no article in ‘on earth’.</li><li>‘I were’: I wish I were, if I were, as if I were, as though I were.</li></ul>","23"],
["Sentence types","<ul><li><b>Assertive:</b> subject … full stop (statement; affirmative or negative).</li><li><b>Interrogative:</b> ends with ?. Wh questions begin with what, which, where, when, why, who, whose, whom, how, how many/much/far/long/often. Verbal (Yes/No) questions begin with an auxiliary.</li><li><b>Imperative:</b> begins with a verb, ends with a full stop (Get out).</li><li><b>Exclamatory:</b> has an exclamation mark.</li><li>Negative words: no, not, nothing, neither, nor, never, nobody, none, hardly, scarcely, barely, rarely, seldom, little, few. <i>A little</i> and <i>a few</i> are positive.</li></ul>","23"],
["Methods &amp; approaches","<ul><li><b>Audio-Lingual (Army Method):</b> behaviorist, drills, habit formation.</li><li><b>CLT:</b> Wilkins, Widdowson; information gap; meaning over form.</li><li><b>Silent Way:</b> Gattegno (Cuisenaire rods). <b>Suggestopedia:</b> Lozanov (relaxation, music). <b>CLL:</b> Curran (counselor-teacher).</li><li>Direct Method is not humanistic; it bans L1.</li></ul>","3"],

["Literature quick facts","<ul><li>Chaucer: Troilus and Criseyde, Rhyme Royal (ababbcc), dedicated to Gower and Strode.</li><li>Langland: Piers Plowman, Alliterative Revival, ‘Fair field full of folk’.</li><li>More: Utopia (1516, Latin), 6-hour workday.</li><li>Sackville &amp; Norton: Gorboduc (1561), first blank verse tragedy.</li><li>Spenser: Prothalamion (Somerset sisters), Epithalamion, Spenserian stanza; ‘Poet’s Poet’ (Lamb).</li><li>First Folio 1623: Heminge &amp; Condell, 36 plays, 18 new. Jonson: ‘Sweet Swan of Avon’.</li><li>Marcellus: ‘Something is rotten in the state of Denmark’.</li></ul>","3"]

var S={cat:"3",tab:"quiz",topic:"All",qi:0,list:[],score:0,done:0,picked:null,vc:"Similes",ci:0,flip:false,deck:[]};
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function btn(label,cls,fn){return '<button class="'+cls+'" onclick="'+fn+'">'+label+'</button>'}
function topics(){var t=["All"];Q.forEach(function(q){if(q[5].indexOf(S.cat)>-1&&q[4]!="Previous Year"&&t.indexOf(q[4])<0)t.push(q[4])});return t}
function build(){S.list=shuffle(Q.filter(function(q){return q[5].indexOf(S.cat)>-1&&(S.tab=="pyq")==(q[4]=="Previous Year")&&(S.topic=="All"||q[4]==S.topic)}));S.qi=0;S.score=0;S.done=0;S.picked=null}
function setCat(c){S.cat=c;S.topic="All";build();buildDeck();render()}
function setTab(t){S.tab=t;S.topic="All";build();render()}
function setTopic(t){S.topic=t;build();render()}
function pick(i){if(S.picked!==null)return;S.picked=i;S.done++;if(i==S.list[S.qi][2])S.score++;render()}
function next(){S.qi++;S.picked=null;render()}
function buildDeck(){S.deck=shuffle(V[S.vc].split("|"));S.ci=0;S.flip=false}
function setVc(v){S.vc=v;buildDeck();render()}
function flip(){S.flip=!S.flip;render()}
function nextCard(d){S.ci=(S.ci+d+S.deck.length)%S.deck.length;S.flip=false;render()}
function reshuffle(){buildDeck();render()}
function render(){
 $("cat").innerHTML=btn("Category 3 (Primary teachers: Pedagogy + Literature)",S.cat=="3"?"on":"","setCat('3')")+btn("Category 2",S.cat=="2"?"on":"","setCat('2')");
 $("tabs").innerHTML=[["quiz","Practice"],["pyq","Previous Year"],["cards","Vocabulary"],["notes","Notes"]].map(function(t){return btn(t[1],S.tab==t[0]?"on":"","setTab('"+t[0]+"')")}).join("");
 var h="";
 if(S.tab=="quiz"||S.tab=="pyq"){
  h+='<div class="row">'+(S.tab=="pyq"?'<span class="tag">Previous year papers. Answers were worked out by me, so please check them against the official key.</span>':'<select onchange="setTopic(this.value)">'+topics().map(function(t){return '<option'+(t==S.topic?' selected':'')+'>'+t+'</option>'}).join("")+'</select>')+btn("Restart","","build();render()")+'</div>';
  if(!S.list.length){h+='<div class="card">No previous year questions added for this category yet. Switch to Category 2.</div>'}else if(S.qi>=S.list.length){h+='<div class="card"><h2>Finished</h2><p>Score: <b>'+S.score+' / '+S.list.length+'</b> ('+Math.round(100*S.score/Math.max(1,S.list.length))+'%)</p>'+btn("Try again","on","build();render()")+'</div>'}
  else{var q=S.list[S.qi];
   h+='<div class="tag">Question '+(S.qi+1)+' of '+S.list.length+' · '+q[4]+' · Score '+S.score+'/'+S.done+'</div><div class="bar"><i style="width:'+(100*S.qi/S.list.length)+'%"></i></div><div class="card"><b>'+q[0].replace("Cat II, Part 2","Cat II, Feb 2019, Part 2")+'</b>';
   q[1].forEach(function(o,i){var c="opt";if(S.picked!==null){if(i==q[2])c+=" ok";else if(i==S.picked)c+=" no"}h+='<button class="'+c+'" onclick="pick('+i+')">'+o+'</button>'});
   if(S.picked!==null)h+='<div class="exp">'+(S.picked==q[2]?"Correct. ":"Not quite. ")+q[3]+'</div><div class="row">'+btn(S.qi+1<S.list.length?"Next":"See score","on","next()")+'</div>';
   h+='</div>'}
 }else if(S.tab=="cards"){
  h+='<div class="row"><select onchange="setVc(this.value)">'+Object.keys(V).map(function(k){return '<option'+(k==S.vc?' selected':'')+'>'+k+'</option>'}).join("")+'</select>'+btn("Shuffle","","reshuffle()")+'</div>';
  var p=S.deck[S.ci].split("="),isSim=S.vc=="Similes";
  var front=isSim?"As "+p[0]+" as …":p[0],back=isSim?"As "+p[0]+" as "+(/^[aeiou]/i.test(p[1])?"an ":"a ")+p[1]:p[1];
  h+='<div class="tag">Card '+(S.ci+1)+' of '+S.deck.length+' · tap to flip</div><div class="card fc" onclick="flip()">'+(S.flip?"<b>"+back+"</b>":front)+'</div><div class="row">'+btn("Previous","","nextCard(-1)")+btn("Next","on","nextCard(1)")+'</div>';
 }else{
  N.filter(function(n){return n[2].indexOf(S.cat)>-1}).forEach(function(n){h+='<details><summary>'+n[0]+'</summary>'+n[1]+'</details>'});
 }
 $("view").innerHTML=h;
}
